name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: node --check src/screenplay_human/static/app.js
      - run: node --test deploy/cloudflare/test-gateway.mjs
      - run: node --test tests/test_human_singularity_ui.cjs
